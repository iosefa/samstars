name: samstars
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.*
  - "scipy>=1.11"
  - "scikit-image>=0.22"
  - "scikit-learn>=1.3"
  - "rasterio>=1.4,<1.5"
  - "geopandas>=1.0"
  - "pyogrio>=0.7.2"
  - "shapely>=2.0"
  - "pandas>=2.0"
  - matplotlib
  - "tqdm>=4.66"
  - "mkdocs>=1.6"
  - "mkdocs-material>=9.5"
  - mkdocs-jupyter
  - "mkdocstrings>=1.0"
  - "mkdocstrings-python>=2.0"
  - "pymdown-extensions>=10.7"
  - "setuptools<81"
  - wheel
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.10.0+cpu
      - torchvision==0.25.0+cpu
      - segment-anything==1.0
      - csbdeep==0.8.1
      - stardist==0.9.1
      - "tensorflow>=2.15,<2.19"
