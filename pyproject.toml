[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samstars"
version = "0.1.0"
description = "Multimodal instance segmentation of individual trees"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Iosefa Percival" }
]
keywords = [
  "segmentation",
  "remote-sensing",
  "lidar",
  "imagery",
  "geospatial"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "affine>=2.4",
  "csbdeep>=0.8.1",
  "geopandas>=1.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pandas>=2.0",
  "Pillow>=10",
  "pyogrio>=0.7.2",
  "rasterio>=1.4,<1.5",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "segment-anything==1.0",
  "shapely>=2.0",
  "stardist>=0.9.1",
  "tensorflow>=2.15,<2.19",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/iosefa/samstars"

[project.optional-dependencies]
metal = [
  "tensorflow-metal>=1.2,<2; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-jupyter",
  "mkdocs-material>=9.5",
  "mkdocstrings>=1.0",
  "mkdocstrings-python>=2.0",
  "pymdown-extensions>=10.7",
]

[tool.setuptools.packages.find]
include = ["samstars*"]
