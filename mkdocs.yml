site_name: samstars
site_description: Multimodal instance segmentation of individual trees
site_url: https://samstars.sefa.ai
repo_url: https://github.com/iosefa/samstars
docs_dir: docs

theme:
    name: material
    palette:
        primary: green
        accent: deep-orange
    icon:
        repo: fontawesome/brands/github
    features:
        - navigation.instant
        - navigation.sections
        - search.highlight
        - search.suggest

plugins:
    - search
    - mkdocs-jupyter
    - mkdocstrings:
        handlers:
            python:
                paths:
                    - .
                options:
                    docstring_style: google
                    show_root_heading: true
                    show_source: true
                    show_symbol_type_heading: true

markdown_extensions:
    - admonition
    - attr_list
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight:
          linenums: true
    - toc:
          permalink: true

nav:
    - Home: index.md
    - Installation: installation.md
    - Quick Start: quickstart.md
    - Data Preparation: data_preparation.md
    - Training: training.md
    - Segmentation: segmentation.md
    - Downstream Analysis: downstream.md
    - Large Raster Runs: large_raster_runs.md
    - Examples:
        - Overview: examples.md
        - Train and Segment One Area: train_and_segment_one_area.ipynb
        - Retrain Refinement for One Area: retrain_stardist_one_area.ipynb
        - Train and Segment a Tiled Area: train_and_segment_tiled_area.ipynb
    - Reference:
        - CLI Scripts: reference/cli.md
        - API Guide: reference/api_levels.md
    - API Reference:
        - samstars.api: api/top_level.md
        - samstars.features.cost_surface: api/features_cost_surface.md
        - samstars.features.seed_generation: api/features_seed_generation.md
        - samstars.data.scaling: api/data_scaling.md
        - samstars.data.tiling: api/data_tiling.md
        - samstars.segmentation.engine: api/segmentation_engine.md
        - samstars.segmentation.proposals: api/segmentation_proposals.md
        - samstars.segmentation.refinement: api/segmentation_refinement.md
        - samstars.training.chips: api/training_chips.md
        - samstars.training.records: api/training_records.md
        - samstars.training.sam_training: api/training_sam.md
        - samstars.training.stardist_training: api/training_stardist.md
    - Report Issues: https://github.com/iosefa/samstars/issues

extra_css:
    - stylesheets/extra.css
