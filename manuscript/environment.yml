name: sam-manuscript
channels:
  - conda-forge
  - defaults
dependencies:
  # Core algorithm deps (so figures and notebooks can import sam/obia/utils)
  - python=3.9
  - numpy
  - scipy
  - scikit-image
  - pytorch
  - torchvision
  - rasterio
  - geopandas
  - shapely
  - fiona
  - opencv
  - tifffile
  - pyogrio
  - tqdm
  - rich

  # Manuscript / analysis
  - jupyter
  - matplotlib
  - seaborn
  - pandas
  - scikit-learn
  - numba
  - imageio
  - stardist
  - csbdeep

  - pip
  - pip:
      - segment-anything
      - shap
