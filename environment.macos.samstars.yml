name: samstars
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.*
  - scipy
  - scikit-image
  - rasterio
  - geopandas
  - fiona
  - shapely
  - pandas
  - matplotlib
  - opencv
  - tqdm
  - mkdocs
  - mkdocs-material
  - mkdocstrings
  - mkdocstrings-python
  - pymdown-extensions
  - "setuptools<81"
  - wheel
  - pip
  - pip:
      - torch==2.10.0
      - torchvision==0.25.0
      - torchaudio==2.10.0
      - segment-anything==1.0
      - pycocotools
      - csbdeep==0.8.1
      - stardist==0.9.1
      - "tensorflow-macos>=2.15,<2.19; platform_machine == 'arm64'"
      - "tensorflow-metal>=1.1; platform_machine == 'arm64'"
      - "tensorflow>=2.15,<2.19; platform_machine != 'arm64'"
