name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Check release version and prerelease status
        run: |
          python - <<'CHECK_RELEASE'
          import json
          import os
          from pathlib import Path
          import tomllib
          from packaging.version import Version

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          release = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["release"]
          tag = f"v{version}"
          if release["tag_name"] != tag or os.environ["GITHUB_REF"] != f"refs/tags/{tag}":
              raise SystemExit(f"Release tag must match package version: {tag}")
          if release["draft"] or release["prerelease"] != Version(version).is_prerelease:
              raise SystemExit("Release prerelease status must match the package version; drafts cannot publish")
          print(f"Validated {tag} (prerelease={release['prerelease']})")
          CHECK_RELEASE

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  checks:
    name: Release checks
    needs: build
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish distributions
    needs: [build, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/samstars
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
